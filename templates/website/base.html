<!doctype html>

{% load static %}

<html lang="en">
    
    <head>

        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>{% block title %} Bookly {% endblock %}</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />

        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"/>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

        <link rel="stylesheet" href="{% static 'website/css/home.css' %}" />

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap-grid.css" integrity="sha512-nIykAn2cWE7iACgVi+thu4am6DGj+0WNXEa8o40WXBOnovP6WuBrIvrjwfxsqMjddjRbgyQqaRt92uQLV60VYw==" crossorigin="anonymous" referrerpolicy="no-referrer">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>

        {% block extra_css %}
        {% endblock %}

    </head>

    <body>
        {% include 'includes/website/header.html' %}
        {% include 'includes/website/message.html' %}

        <main class="my-5">{% block main %}{% endblock %}</main>

        {% include 'includes/website/footer.html' %}

        <!-- Lucide Icons -->

        <script src="https://unpkg.com/lucide@latest"></script>

        <script>
            lucide.createIcons();
        </script>

        <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

        <script src="{% static 'website/js/main.js' %}"></script>

        {% block extra_js %}{% endblock %}

    </body>

</html>
